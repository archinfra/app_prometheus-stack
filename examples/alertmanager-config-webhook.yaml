global:
  resolve_timeout: 5m

route:
  group_by:
    - namespace
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: webhook-default

receivers:
  - name: webhook-default
    webhook_configs:
      - url: http://alert-webhook.monitoring.svc/alerts
        send_resolved: true
